name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm, wasm-gc, js]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
      - run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: moon version --all
      - run: moon update
      - run: moon check --target ${{ matrix.target }} --deny-warn
      - run: moon run dev/verify.mbtx -- ${{ matrix.target }}
  command:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os != 'Windows'
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
      - if: runner.os != 'Windows'
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Invoke-Expression (Invoke-RestMethod 'https://cli.moonbitlang.com/install/powershell.ps1')
      - if: runner.os == 'Windows'
        shell: pwsh
        run: Add-Content -LiteralPath $env:GITHUB_PATH -Value "$env:USERPROFILE\.moon\bin"
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - run: moon version --all
      - run: moon update
      - run: moon check --target native --deny-warn
      - run: moon run dev/verify.mbtx -- native
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: relmask_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: relmask_test
    steps:
      - uses: actions/checkout@v4
      - run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
      - run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - run: sudo apt-get update
      - run: sudo apt-get install -y postgresql-client
      - run: moon update
      - run: moon check --target native --deny-warn
      - run: moon run dev/sql_workflow.mbtx -- native moon --database
